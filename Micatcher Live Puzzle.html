<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micatcher 2026 — Live Puzzle</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />

  <!-- KV assets (assets/) — manifest + preload -->
  <link rel="preload" href="assets/logo.png" as="image" />
  <link rel="preload" href="assets/bg-main.png" as="image" />
  <link rel="preload" href="assets/bg-3.png" as="image" />
  <link rel="preload" href="assets/bg-4.png" as="image" />
  <script>
    window.MICATCHER_ASSETS = {
      logo: "assets/logo.png",
      mascot: "assets/mascot.png",
      bg: {
        main: "assets/bg-main.png",
        1: "assets/bg-1.png",
        2: "assets/bg-2.png",
        3: "assets/bg-3.png",
        4: "assets/bg-4.png",
        5: "assets/bg-5.png",
        6: "assets/bg-6.png",
        7: "assets/bg-7.png",
        8: "assets/bg-8.png",
      },
      cave: {
        mountains: "assets/bg-4.png",
        spire: "assets/bg-3.png",
      },
    };

    window.getAsset = function (key) {
      var parts = String(key).split(".");
      var node = window.MICATCHER_ASSETS;
      for (var i = 0; i < parts.length; i++) {
        if (!node || typeof node !== "object") return null;
        node = node[parts[i]];
      }
      return typeof node === "string" ? node : null;
    };

    window.getBgAsset = function (variant) {
      if (!variant || variant === "none") return null;
      var map = window.MICATCHER_ASSETS && window.MICATCHER_ASSETS.bg;
      return (map && map[variant]) || "assets/bg-" + variant + ".png";
    };
  </script>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel pinned -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- MediaPipe Hands (Gameplay/) -->
  <script type="module">
    import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    window.MPV = { FilesetResolver, HandLandmarker };
    window.dispatchEvent(new Event("mp-ready"));
  </script>

  <!-- Gameplay logic (ported from Gameplay/gameplay/) -->
  <script src="gameplay/constants.js"></script>
  <script src="gameplay/puzzle.js"></script>
  <script src="gameplay/coordinates.js"></script>
  <script src="gameplay/gestures.js"></script>
  <script src="gameplay/PuzzlePlayerSession.js"></script>
  <script src="gameplay/hand-tracking.js"></script>
  <script src="gameplay/canvas-draw.js"></script>
  <script src="gameplay/index.js"></script>

  <!-- Tweaks panel (loaded first so its exports are global) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- App pieces -->
  <script type="text/babel" src="mascot.jsx"></script>
  <script type="text/babel" src="decor.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="screens-intro.jsx"></script>
  <script type="text/babel" src="gesture-camera.jsx"></script>
  <script type="text/babel" src="screens-game.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
